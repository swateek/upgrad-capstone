# Source manifest for the procurement domain pack.
#
# Hand-edited. Lists every external file the domain uses, where it came from, and which
# edition it is. Hashes are NOT kept here: `python -m copilot.ingest.download --freeze`
# writes them to manifest.lock.yaml next to this file. Both files are committed; the
# downloaded files themselves stay in the gitignored data/ folder.
#
# Fields
#   id            stable id, used as doc_id prefix in citations
#   store         policy | screening | model_tender
#                 (model_tender is indexed only if the by-rule policy split is under 500 docs)
#   instrument    short instrument key, used by search_policy(query, instrument)
#   url           the exact file downloaded
#   source_page   the official page the url was taken from (checked 12 Nov 2026)
#   edition       edition as printed / listed
#   edition_date  ISO date of the edition (see editions.md for how each was chosen)
#   index_scope   what part of the file is indexed (default: all)
#   language      en only; ingest refuses anything else

domain: procurement
checked_on: 2026-11-12

sources:
  - id: goods_manual_2024
    store: policy
    instrument: goods_manual
    title: Manual for Procurement of Goods, Second Edition, 2024
    url: https://doe.gov.in/files/circulars_document/Manual_Goods_2024.pdf
    source_page: https://doe.gov.in/circulars/manual-procurement-goods-second-edition-2024
    alt_urls:
      - https://doe.gov.in/files/manuals_documents/Goods.pdf # DoE manuals list, row 4
    edition: Second Edition, 2024
    edition_date: 2024-08-16 # DoE circular date; foreword dated 2024-07-22
    language: en

