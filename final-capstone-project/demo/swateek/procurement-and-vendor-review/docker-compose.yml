# Procurement copilot: demo-floor stack.
#
#   docker compose --profile ingest run --rm ingest   # once: verify sources, chunk, embed -> Qdrant
#   docker compose up -d                              # api + web + qdrant
#   open http://localhost:3400
#
# Secrets come from .env (copy env.sample). Nothing secret is baked into an image.
# PROVIDER in .env picks siliconflow or upgrad; each has its own Qdrant collection, so switching
# is: edit .env, `docker compose up -d api`. The course CA certificates are mounted from ./certs.

x-backend: &backend
  build: ./backend
  image: copilot-backend:dev
  env_file: .env
  environment:
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /app/data
    DOMAINS_DIR: /app/domains
    TRACE_ENVIRONMENT: docker
  volumes:
    - ./domains:/app/domains:ro
    - ./certs:/app/certs:ro
    - copilot-data:/app/data

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant-storage:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-3402}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # retrieval cache + rate-limit counters; nothing durable, so no volume
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingest:
    <<: *backend
    profiles: ["ingest"]
    depends_on:
      qdrant:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python -m copilot.ingest.download &&
        python -m copilot.ingest.build_chunks &&
        python -m copilot.ingest.index

  api:
    <<: *backend
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3401}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./web
    image: copilot-web:dev
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3400}:3000"

volumes:
  copilot-data:
  qdrant-storage:
