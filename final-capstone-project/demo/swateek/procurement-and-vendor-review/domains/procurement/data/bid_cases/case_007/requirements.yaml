case_id: case_007
synthetic: true
mandatory:
  - id: M1
    text: Bid Securing Declaration in the prescribed form is submitted with the bid.
    field: bid_security_declaration
    pass_if: true
  - id: M2
    text: Authorisation from the Original Equipment Manufacturer (OEM) for the offered laptop model is submitted, or the bidder is the OEM.
    field: oem_authorisation
    pass_if: true
  - id: M3
    text: Average annual turnover of the bidder in the last three financial years is at least Rs 50 lakh.
    field: avg_turnover_inr
    pass_if: {min: 5000000}
scored:
  - id: S1
    text: Number of similar supply orders (at least 30 laptops each) completed in the last three years.
    field: similar_orders
    weight: 35
    rubric:
      - {min: 3, marks: 35}
      - {min: 2, marks: 20}
      - {min: 1, marks: 10}
      - {min: 0, marks: 0}
  - id: S2
    text: Comprehensive onsite warranty offered, in years.
    field: warranty_years
    weight: 25
    rubric:
      - {min: 3, marks: 25}
      - {min: 1, marks: 10}
      - {min: 0, marks: 0}
  - id: S3
    text: Installed RAM in the offered laptop model, in GB.
    field: ram_gb
    weight: 20
    rubric:
      - {min: 16, marks: 20}
      - {min: 8, marks: 10}
      - {min: 0, marks: 0}
  - id: S4
    text: Delivery period offered, in days from the date of the contract (lower is better).
    field: delivery_days
    weight: 20
    rubric:
      - {max: 30, marks: 20}
      - {max: 45, marks: 10}
      - {min: 0, marks: 0}
price:
  field: quoted_price_inr
  basis: Total price for 60 laptops including GST, delivery and installation of the licensed operating system.
