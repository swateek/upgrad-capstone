case_id: case_001
synthetic: true
mandatory:
  - id: M1
    text: Bid Securing Declaration in the prescribed form is submitted with the bid.
    field: bid_security_declaration
    pass_if: true
  - id: M2
    text: Authorisation from the Original Equipment Manufacturer (OEM) for the offered model is submitted.
    field: oem_authorisation
    pass_if: true
  - id: M3
    text: Average annual turnover of the bidder in the last three financial years is at least Rs 30 lakh.
    field: avg_turnover_inr
    pass_if: {min: 3000000}
scored:
  - id: S1
    text: Number of similar supply orders (at least 20 desktops each) completed in the last three years.
    field: similar_orders
    weight: 40
    rubric:
      - {min: 3, marks: 40}
      - {min: 2, marks: 25}
      - {min: 1, marks: 10}
      - {min: 0, marks: 0}
  - id: S2
    text: Comprehensive onsite warranty offered, in years.
    field: warranty_years
    weight: 25
    rubric:
      - {min: 5, marks: 25}
      - {min: 3, marks: 15}
      - {min: 0, marks: 0}
  - id: S3
    text: Authorised service centre located in the consignee's city.
    field: local_service_centre
    weight: 20
    rubric:
      - {equals: true, marks: 20}
      - {equals: false, marks: 0}
  - id: S4
    text: Delivery period offered, in days from the date of the contract (lower is better).
    field: delivery_days
    weight: 15
    rubric:
      - {max: 30, marks: 15}
      - {max: 45, marks: 8}
      - {min: 0, marks: 0}
price:
  field: quoted_price_inr
  basis: Total price for 40 desktops including GST, delivery and installation.
