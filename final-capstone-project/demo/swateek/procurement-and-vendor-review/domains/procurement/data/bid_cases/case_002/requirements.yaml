case_id: case_002
synthetic: true
mandatory:
  - id: M1
    text: Bid Securing Declaration in the prescribed form is submitted with the bid.
    field: bid_security_declaration
    pass_if: true
  - id: M2
    text: Authorisation from the Original Equipment Manufacturer (OEM) for the offered cameras and NVR is submitted.
    field: oem_authorisation
    pass_if: true
  - id: M3
    text: Average annual turnover of the bidder in the last three financial years is at least Rs 40 lakh.
    field: avg_turnover_inr
    pass_if: {min: 4000000}
scored:
  - id: S1
    text: Number of similar CCTV supply and installation orders (at least 30 IP cameras each) completed in the last three years.
    field: similar_orders
    weight: 35
    rubric:
      - {min: 3, marks: 35}
      - {min: 2, marks: 20}
      - {min: 1, marks: 10}
      - {min: 0, marks: 0}
  - id: S2
    text: Comprehensive onsite warranty offered on cameras and NVR, in years.
    field: warranty_years
    weight: 25
    rubric:
      - {min: 5, marks: 25}
      - {min: 3, marks: 15}
      - {min: 0, marks: 0}
  - id: S3
    text: Offered camera models hold a valid STQC test certificate.
    field: stqc_certified
    weight: 20
    rubric:
      - {equals: true, marks: 20}
      - {equals: false, marks: 0}
  - id: S4
    text: Delivery and installation period offered, in days from the date of the contract (lower is better).
    field: delivery_days
    weight: 20
    rubric:
      - {max: 30, marks: 20}
      - {max: 45, marks: 10}
      - {min: 0, marks: 0}
price:
  field: quoted_price_inr
  basis: Total price for 48 IP cameras, one 64-channel NVR, cabling and installation, including GST.
