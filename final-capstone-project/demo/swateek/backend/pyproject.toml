[project]
name = "copilot"
version = "0.1.0"
description = "Track B procurement and vendor-review copilot (Deep Agents harness, domain packs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.7.36",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langfuse==5.0.4",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "pypdf>=7.0.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["copilot", "screening"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." for the eval runners

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
