# Reference labels for the advisory-reviewer agreement check (plan §10.6, mentor B1.3).
#
# Sample: 30 answered turns from planner-1 that the advisory reviewer checked: all 7 wrong
# ones plus 23 drawn from the correct ones with random.Random(106).sample (see
# eval/reviewer_agreement.py). planner-2/3 and router produced the same answers.
#
# Question per sentence, same as the reviewer's: does the cited source text support it?
#   S = supported: the cited source states the rule or fact (an amount counts as supported
#       when the source gives the rate or rule it comes from; the arithmetic is the
#       calculator's job, not the reviewer's).
#   U = not supported: the source doesn't say it, says something else, or the sentence states
#       something about the traveller the source can't back.
# Judged against the clause text in data/chunks/documents.jsonl. The reviewer may have seen a
# shorter retrieved passage of the same clause.
#
# labels: one letter per working sentence, in order. why: sentence number -> reason (given for
# every U and where the label could be argued).
