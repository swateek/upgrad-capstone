# US Customs Assistant: the laptop demo stack (plan D21, §13).
#
#   cp env.sample .env          # fill in the upgrad and Langfuse keys
#   docker compose up -d        # api + web + qdrant + redis
#   open http://localhost:3500
#
# Secrets come from .env only; nothing secret is baked into an image. The course CA certificates
# are mounted from ./certs. The api calls the upgrad endpoints once questions are asked, so
# running the stack with real keys needs the user's OK (AGENTS.md).
#
#   docker compose --profile ingest run --rm ingest   # download (verify vs lock) -> chunk
#
# The ingest job fetches public government pages only; indexing (upgrad embeddings) is added
# in plan step 6 and needs the user's OK.

x-backend: &backend
  build: ./backend
  image: customs-backend:dev
  env_file: .env
  environment:
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /app/data
    PACK_DIR: /app/pack
    TRACE_ENVIRONMENT: docker
    ALLOWED_ORIGINS: '["http://localhost:${WEB_PORT:-3500}"]'
  volumes:
    - ./pack:/app/pack:ro
    - ./certs:/app/certs:ro
    - customs-data:/app/data

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant-storage:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-3502}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # retrieval/answer cache + rate-limit counters; nothing durable, so no volume
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingest:
    <<: *backend
    profiles: ["ingest"]
    command:
      - sh
      - -c
      - >-
        python -m customs.ingest.download &&
        python -m customs.ingest.build_chunks

  api:
    <<: *backend
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3501}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./web
    image: customs-web:dev
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3500}:3000"

volumes:
  customs-data:
  qdrant-storage:
