  I07:
    turns:
      - {outcome: clarify, clarify: [origin_country_of_line, arrival_state],
         question: "Was the pisco made in Peru, and which US state do you land in?"}
      - {outcome: answered, kind: owe, rules: [R9, R2, R7, R8], notes: [disclaimer, generic_state_note, fta_caveat]}
  I08:
    turns:
      - {outcome: clarify, clarify: [origin_country_of_line, arrival_state],
         question: "Where was the rum made, and which US state do you land in?"}
      - {outcome: answered, kind: nothing_owed, rules: [R9, R2], notes: [disclaimer, generic_state_note]}

  # --- state_flag -----------------------------------------------------------------------------------
  J01: {turns: [{outcome: answered, kind: owe, rules: [R9, R7, R8, "STATE:NY"], notes: [disclaimer, "state_flag:NY"]}]}
  J02: {turns: [{outcome: answered, kind: owe, rules: [R9, R7, R8, "STATE:TX"], notes: [disclaimer, "state_flag:TX", fta_caveat]}]}
  J03: {turns: [{outcome: answered, kind: owe, rules: [R9, R2, R7, R8, "STATE:FL"], notes: [disclaimer, "state_flag:FL"]}]}

  # --- out_of_scope ---------------------------------------------------------------------------------
  K01: {turns: [{outcome: out_of_scope, kind: out_of_scope, rules: [], notes: ["scope_note:vapes_nicotine"]}]}
  K02: {turns: [{outcome: out_of_scope, kind: out_of_scope, rules: [], notes: ["scope_note:non_resident"]}]}
