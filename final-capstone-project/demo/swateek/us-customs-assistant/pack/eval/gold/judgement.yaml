# Judgement layer for the gold (independent builder, plan D18).
#
# This file holds every part of the gold that is a JUDGEMENT rather than arithmetic:
#   outcome, bottom-line kind, clarify fields, the rules cited (one claim per rule applied),
#   required notes, the facts for earlier turns of correction scenarios, and what-if targets.
# build_gold.py computes all money and volume figures from the scenario facts + pack/rules tables,
# and cross-checks this file against what the arithmetic implies (kind, notes, rules); any
# disagreement stops the build. Decisions on ambiguous points are explained in ISSUES.md.
#
# Rule tokens: R1..R12; R4.third_country / R4.acquired_in_cuba (sub-lists of R4 cites);
#              STATE:XX (states.yaml cites).
#
# Shorthand used below:
#   std   = rules [R9, R11, R7, R8]   (an $800 answer with dutiable alcohol from 2+ alcohol lines)
#   std1  = rules [R9, R7, R8]        (same, one admissible alcohol line: R11 not required, A6/F1)
#   notes always list `disclaimer` for answered and escalated turns.

defaults:
  std_rules: &std [R9, R11, R7, R8]
  std_rules_one_line: &std1 [R9, R7, R8]   # single admissible alcohol line: no R11 (A6, finding F1)

scenarios:
  # --- alcohol_excess_800 -----------------------------------------------------------------------
  A01: {turns: [{outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note]}]}
  A02: {turns: [{outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note]}]}
  A03: {turns: [{outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note]}]}
  A04: {turns: [{outcome: answered, kind: owe, rules: *std, notes: [disclaimer, generic_state_note]}]}
  A05: {turns: [{outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note]}]}
  A06: {turns: [{outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note]}]}
  A07: {turns: [{outcome: answered, kind: nothing_owed, rules: [R9], notes: [disclaimer, generic_state_note]}],
        why: "Mexico arrival: $800 regardless of time away (R9); 750 ml fits the 1 L allowance."}
  A08: {turns: [{outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note, fta_caveat]}]}
  A09: {turns: [{outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note, fta_caveat]}]}
  A10: {turns: [{outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note, fta_caveat]}]}
  A11: {turns: [{outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note]}],
        why: "Belarusian vodka: Column 2 origin (GN 3(b)), 4% flat rate (R7 column2_rate). Not under the Russia scope note (Decision G is Russian-origin only)."}
  A12: {turns: [{outcome: answered, kind: nothing_owed, rules: [R9], notes: [disclaimer, generic_state_note]}]}

  # --- alcohol_cbi_2L ----------------------------------------------------------------------------
  B01: {turns: [{outcome: answered, kind: nothing_owed, rules: [R9, R2], notes: [disclaimer, generic_state_note]}]}
  B02: {turns: [{outcome: answered, kind: owe, rules: [R9, R2, R7, R8], notes: [disclaimer, generic_state_note]}]}
  B03: {turns: [{outcome: answered, kind: owe, rules: [R9, R2, R11, R7, R8], notes: [disclaimer, generic_state_note, fta_caveat]}]}
  B04: {turns: [{outcome: answered, kind: owe, rules: [R9, R2, R11, R7, R8], notes: [disclaimer, generic_state_note]}],
        why: "Bahamas is on CBP's list, but neither bottle is a beneficiary-country product: 1 L (R2)."}

  # --- exemption_200_all_or_nothing ---------------------------------------------------------------
  C01: {turns: [{outcome: answered, kind: owe, rules: [R9, R1, R7, R8], notes: [disclaimer, generic_state_note, fta_caveat]}]}
  C02: {turns: [{outcome: answered, kind: owe, rules: [R9, R1, R7, R8], notes: [disclaimer, generic_state_note, fta_caveat]}]}
  C03: {turns: [{outcome: answered, kind: owe, rules: [R9, R1, R7, R8], notes: [disclaimer, generic_state_note]}]}
  C04: {turns: [{outcome: answered, kind: nothing_owed, rules: [R9, R1], notes: [disclaimer, generic_state_note]}]}
  C05: {turns: [{outcome: answered, kind: mixed, rules: [R9, R1, R5, R7, R8], notes: [disclaimer, generic_state_note, fta_caveat, seizure_risk]}],
        why: "375 ml > 150 ml breaks the $200 all-or-nothing: nothing is exempt, so all 40 cigarettes are outside any exemption (seizure risk, R5) and the wine is dutiable."}
  C06: {turns: [{outcome: answered, kind: owe, rules: [R9, R1, R7, R8], notes: [disclaimer, generic_state_note]}]}
  C07: {turns: [{outcome: answered, kind: seizure_risk, rules: [R9, R1, R5], notes: [disclaimer, seizure_risk]}],
        why: "12 cigars > 10: nothing exempt under $200; tobacco outside the exemption is not taxed but at seizure risk (R5)."}
  C08: {turns: [{outcome: answered, kind: owe, rules: [R9, R1, R7, R8, "STATE:CA"], notes: [disclaimer, "state_flag:CA", fta_caveat]}]}

  # --- tobacco_over_limit ------------------------------------------------------------------------
  D01:
    turns:
      - {outcome: clarify, clarify: [age_21_plus, exemption_used_last_30_days],
         question: "Are you 21 or older, and have you used your duty-free exemption in the last 30 days?"}
      - {outcome: answered, kind: seizure_risk, rules: [R9, R5], notes: [disclaimer, seizure_risk]}
  D02: {turns: [{outcome: answered, kind: seizure_risk, rules: [R9, R5, R6], notes: [disclaimer, seizure_risk, us_export_labelled_relinquish]}]}
  D03: {turns: [{outcome: answered, kind: seizure_risk, rules: [R9, R5], notes: [disclaimer, seizure_risk]}]}
  D04: {turns: [{outcome: answered, kind: seizure_risk, rules: [R9, R5], notes: [disclaimer, seizure_risk]}]}
  D05: {turns: [{outcome: answered, kind: nothing_owed, rules: [R9, R5], notes: [disclaimer]}]}
  D06: {turns: [{outcome: answered, kind: mixed, rules: [R9, R7, R8, R5], notes: [disclaimer, generic_state_note, seizure_risk]}]}
  D07: {turns: [{outcome: answered, kind: seizure_risk, rules: [R9, R5], notes: [disclaimer, seizure_risk]}]}

  # --- cuban_origin -------------------------------------------------------------------------------
  E01: {turns: [{outcome: answered, kind: prohibited, rules: [R4.third_country], notes: [disclaimer, cuban_prohibited]}]}
  E02: {turns: [{outcome: answered, kind: prohibited, rules: [R4.acquired_in_cuba], notes: [disclaimer, cuban_prohibited]}]}
  E03: {turns: [{outcome: answered, kind: prohibited, rules: [R4.third_country], notes: [disclaimer, cuban_prohibited]}]}
  E04:
    turns:
