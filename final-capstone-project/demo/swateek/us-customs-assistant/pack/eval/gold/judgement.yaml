  DV12: {turns: [{outcome: answered, kind: owe, rules: [R9, R3, R7, R8], notes: [disclaimer, generic_state_note]}]}
  DV13: {turns: [{outcome: answered, kind: mixed, rules: [R9, R11, R7, R8, R5], notes: [disclaimer, generic_state_note, seizure_risk]}]}
  DV14: {turns: [{outcome: answered, kind: nothing_owed, rules: [R9, R2], notes: [disclaimer, generic_state_note]}]}
  DV15:
