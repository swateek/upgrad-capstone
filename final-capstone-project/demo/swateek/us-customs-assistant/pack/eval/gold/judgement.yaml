      - {outcome: answered, kind: prohibited, rules: [R12, R4.third_country], notes: [disclaimer, possibly_cuban_declare]}
    why: "Origin still unknown after the one question: Decision E, treat as possibly Cuban, no allowance, declare."
  E05:
    turns:
      - {outcome: clarify, clarify: [origin_country_of_line], question: "Were the Montecristos made in Cuba?"}
      - {outcome: answered, kind: nothing_owed, rules: [R9, R5], notes: [disclaimer]}
  E06: {turns: [{outcome: answered, kind: mixed, rules: [R4.third_country, R9, R7, R8], notes: [disclaimer, cuban_prohibited, generic_state_note]}]}
  E07: {turns: [{outcome: answered, kind: prohibited, rules: [R4.third_country], notes: [disclaimer, cuban_prohibited]}],
        why: "A gift does not change origin: Cuban-origin tobacco acquired in Mexico (third country) is prohibited."}

  # --- under_21 -----------------------------------------------------------------------------------
  F01: {turns: [{outcome: answered, kind: owe, rules: [R9, R3, R7, R8], notes: [disclaimer, generic_state_note]}]}
