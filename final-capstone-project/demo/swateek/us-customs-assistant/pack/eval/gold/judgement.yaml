  # --- mixed_basket -------------------------------------------------------------------------------
  G01: {turns: [{outcome: answered, kind: mixed, rules: [R9, R2, R5, R4.third_country, "STATE:FL"], notes: [disclaimer, seizure_risk, cuban_prohibited, "state_flag:FL"]}],
