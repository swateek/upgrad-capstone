  G04: {turns: [{outcome: answered, kind: owe, rules: [R9, R11, R7, R8, "STATE:IL"], notes: [disclaimer, "state_flag:IL"]}]}
  G05: {turns: [{outcome: answered, kind: owe, rules: [R9, R7, R8, R5], notes: [disclaimer, generic_state_note, fta_caveat]}]}
  G06: {turns: [{outcome: answered, kind: owe, rules: *std, notes: [disclaimer, generic_state_note]}]}
  G07: {turns: [{outcome: escalated, kind: escalated, rules: [R10], notes: [disclaimer, large_quantity]}],
        why: "16 x 750 ml + 1 L = 13 L > 12 L flag (Decision D): large-quantity note and escalate."}
  G08: {turns: [{outcome: answered, kind: owe, rules: [R9, R11, R7, R8, R5], notes: [disclaimer, generic_state_note]}]}
  G09: {turns: [{outcome: answered, kind: owe, rules: [R9, R7, R8, R5], notes: [disclaimer, generic_state_note, fta_caveat]}]}
  G10: {turns: [{outcome: answered, kind: owe, rules: *std, notes: [disclaimer, generic_state_note]}]}

  # --- whatif ---------------------------------------------------------------------------------------
  H01: {turns: [{outcome: answered, kind: whatif, rules: *std1, notes: [disclaimer, generic_state_note],
                 whatif: {mode: owe_below, limit_usd: "10", unit_value_usd: "20"}}]}
  H02: {turns: [{outcome: answered, kind: whatif, rules: *std1, notes: [disclaimer, generic_state_note],
                 whatif: {mode: owe_below, limit_usd: "20", unit_value_usd: "30"}}]}
  H03: {turns: [{outcome: answered, kind: whatif, rules: *std1, notes: [disclaimer, generic_state_note, fta_caveat],
                 whatif: {mode: owe_below, limit_usd: "5", unit_value_usd: "35"}}]}
  H04: {turns: [{outcome: answered, kind: whatif, rules: [R9, R5], notes: [disclaimer],
                 whatif: {mode: within_allowance}}]}

  # --- clarify --------------------------------------------------------------------------------------
  I01:
    turns:
      - {outcome: clarify, clarify: [age_21_plus, exemption_used_last_30_days, arrival_state],
         question: "Are you 21 or older, have you used your duty-free exemption in the last 30 days, and which US state do you land in?"}
