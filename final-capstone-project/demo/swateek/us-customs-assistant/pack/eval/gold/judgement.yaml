  I03:
    turns:
      - {outcome: clarify, clarify: [value_usd_of_line, arrival_state],
         question: "What did the riesling cost, and which US state do you land in?"}
      - {outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note, value_unknown_duty_note]}
    why: "Value still unknown after the one question: excise only, duty shown as 3% of the value (facts.yaml if_missing; SPEC 5 step 5). owe_usd is the excise (the only computable part)."
  I04:
    turns:
      - {outcome: clarify, clarify: [trip_hours_or_arrived_from_mexico, arrival_state],
         question: "How long were you away, and which US state do you land in?"}
      - {outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note]}
  I05:
    turns:
      - {outcome: clarify, clarify: [age_21_plus, arrival_state],
         question: "Are you 21 or older, and which US state do you land in?"}
      - {outcome: answered, kind: owe, rules: *std1, notes: [disclaimer, generic_state_note]}
  I06:
    turns:
      - {outcome: clarify, clarify: [exemption_used_last_30_days, arrival_state],
         question: "Have you used your duty-free exemption in the last 30 days, and which US state do you arrive in?"}
