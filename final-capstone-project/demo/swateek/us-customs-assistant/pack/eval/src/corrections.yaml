  facts:
    profile: {age: 45, trip_hours: 144, arrived_directly_from: GB, exemption_used_last_30_days: false}
    basket:
      - {item: spirits, quantity: 4, unit: bottle, container_ml: 700, abv: 40, value_usd: 200, origin: GB, bought_in: GB}

