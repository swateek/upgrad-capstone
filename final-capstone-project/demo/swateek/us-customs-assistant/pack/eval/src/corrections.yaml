# Corrections suite: 6 multi-turn scenarios (plan D17). The traveller corrects one fact after the
# first answer; the agent must replan only the affected steps. Scored separately; frozen with eval-v1.
# `facts` = the facts after the correction. Gold covers both answers.

- id: CR01
  category: correction_trip_length
  turns:
    - "I'm 34, back from Italy, first trip this year. I was there 10 days and bought four 750 ml bottles of wine at $30 each. What do I owe?"
    - "Sorry, I got that wrong: I was only away for 36 hours, a quick stopover."
  facts:
    profile: {age: 34, trip_hours: 36, arrived_directly_from: IT, exemption_used_last_30_days: false}
    basket:
      - {item: wine, quantity: 4, unit: bottle, container_ml: 750, value_usd: 120, origin: IT, bought_in: IT}

- id: CR02
  category: correction_age
  turns:
    - "I'm 22, back from 8 days in Lisbon, first trip this year. I have one 750 ml bottle of Portuguese wine (12%) at $20. Do I owe anything?"
    - "Actually I'm 20, I turn 21 next year."
  facts:
    profile: {age: 20, trip_hours: 192, arrived_directly_from: PT, exemption_used_last_30_days: false}
    basket:
      - {item: wine, quantity: 1, unit: bottle, container_ml: 750, abv: 12, value_usd: 20, origin: PT, bought_in: PT}

- id: CR03
