# Source manifest for the US Customs Assistant corpus.
#
# Hand-edited. Lists every external file the corpus uses, where it came from, and which edition
# it is. Hashes are NOT kept here: `python -m customs.ingest.download --freeze` writes them to
# manifest.lock.yaml next to this file. Both files are committed; the downloaded files stay in the
# gitignored data/ folder. Edition decisions are explained in editions.md.
#
# Fields
#   id            stable id, used as the doc_id prefix in citations
#   format        xml | html | pdf | json (the downloader checks the body matches)
#   parser        how the file becomes documents (customs.ingest.parsers); rules in splitting.yaml
#   topic         exemptions | rates | sanctions | state | declaring | other_goods
#   role          core | hard_negative (neighbouring rules that test retrieval precision) | flag
#   url           the exact file downloaded; versioned URLs wherever the publisher offers them
#   source_page   the official page the url was found from (checked 17 Nov 2026)
#   edition_date  ISO date of the edition, or null for a live page (the lock records retrieval)

checked_on: 2026-11-17

