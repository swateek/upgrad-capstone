  category: phrasing
  source: D11
  question: "Two weeks in Glasgow, Scotland, my first trip this year, and I'm forty-nine. Coming home with 2 bottles of Scotch whisky (700 ml, 40%, $50 a bottle) and 100 cigarettes in five 20-packs, $10 per pack. What do I owe at customs?"
