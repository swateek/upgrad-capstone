    kind: ecfr
    title_number: 31
    part: "515"
    authority: primary_regulation
    tags: [cuba]
    heading_rules:
      - {if_any: [importation, merchandise, imports], tags: [cuba_import]}
      - {if_any: [travel], tags: [cuba_travel]}
      - {if_any: [alcohol, tobacco], tags: [alcohol, tobacco]}

  - id: 27cfr27
    title: "27 CFR Part 27 - Importation of distilled spirits, wines, and beer (TTB)"
    kind: ecfr
    title_number: 27
    part: "27"
