    tags: [ttb, alcohol, commercial_import]
    heading_rules:
      - {if_any: [rate, tax], tags: [excise]}
      - {if_any: [personal, samples, exemption], tags: [personal_use]}

  - id: 27cfr41
    title: "27 CFR Part 41 - Importation of tobacco products, cigarette papers and tubes (TTB)"
