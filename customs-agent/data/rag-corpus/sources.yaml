# Source manifest for the DeclareRight RAG corpus (v2: one document per unit).
# fetch_corpus.py reads this file and writes corpus/docs/<doc_id>.md, corpus/MANIFEST.json
# and gzipped raw snapshots in corpus/raw/.
#
# authority (copied onto every document and chunk):
#   primary_regulation - binding text (CFR, U.S. Code, HTSUS, Executive Order). Cite these first.
#   agency_guidance    - CBP / OFAC / TTB explanations of the rules.
#   tax_rates          - TTB excise rate tables.
#   state_guidance     - the five arrival states' own pages (flag only, no amounts).
#   hard_negative      - looks similar but must never be cited to a traveller (crew rules,
#                        food, currency, visitors...). Kept to test retrieval.
#
# kind: ecfr | usc | hts_lines | hts_ch98 | hts_general_notes | ofac_faqs | federal_register | html | pdf
# citation_id: the id rules.yaml and the eval gold cite; CFR, USC and HTSUS ids are built per unit.
# heading_rules: if the unit's heading contains any keyword, add tags / set authority.
# off_topic_unless: units whose heading has none of these keywords become hard negatives.
# start / end: regexes that cut a page's main text (first line matching start, up to the first end);
#   start_last: use the last line matching start (pages with a table of contents first).
# flatten_tables: treat layout tables as plain text (e-mail bulletins).

# eCFR point-in-time date for every CFR source (corpus-v1). Change it only to refresh the corpus on purpose.
ecfr_as_of: "2026-11-19"

sources:

  # ================================================================ CFR (eCFR API, one doc per section)
  - id: 19cfr148
    title: "19 CFR Part 148 - Personal declarations and exemptions"
    kind: ecfr
    title_number: 19
    part: "148"
    authority: primary_regulation
    tags: [cfr19_148]
    heading_rules:
      - {if_any: [crewmember, crew], tags: [crew, hard_negative], authority: hard_negative}   # same 50/10/150 ml limits as 148.51
      - {if_any: [nonresident, non-resident, foreign officials, diplomatic], tags: [non_resident, out_of_scope]}
      - {if_any: [returning resident], tags: [returning_resident]}
      - {if_any: [insular possession, virgin islands, guam, american samoa], tags: [insular_possession, out_of_scope]}
      - {if_any: [flat rate], tags: [flat_rate]}
      - {if_any: [alcoholic, liquor, beverage], tags: [alcohol]}
      - {if_any: [cigar, tobacco], tags: [tobacco]}
      - {if_any: [declaration], tags: [declaration]}

  - id: 31cfr515
