      - {if_any: [rate, tax], tags: [excise]}
      - {if_any: [personal, exemption, returning], tags: [personal_use]}
      - {if_any: [labeled for export, previously exported, reimport], tags: [export_labelled]}

  - id: 31cfr1010_currency
    title: "31 CFR 1010.340 - Reports of transportation of currency or monetary instruments (HARD NEGATIVE)"
