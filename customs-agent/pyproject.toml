[project]
name = "customs-agent"
version = "0.1.0"
description = "DeclareRight: US customs assistant for alcohol and tobacco (Track B capstone)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "lxml>=6.1.3",
    "markdownify>=1.2.4",
    "numpy>=2.5.5",
    "openai>=3.57.0",
    "pycountry>=26.2.16",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rank-bm25>=0.2.2",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
pdf = [
    "pdfplumber>=0.11.11",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests call the real endpoints; run them with `uv run pytest -m live -v`.
addopts = "-m 'not live'"
markers = ["live: calls the real chat/embeddings endpoints (uses quota)"]
