# Multi-turn dev conversations (Days 8-9): clarify answered across turns, corrections, edits on
# the answer card, defaults after two unanswered rounds (SPEC 5.2), refusals mid-conversation.
#
# Dev data: tune on it freely; never on eval-v2 (CLAUDE.md rule 6).
# Written by the session that builds the agent, so phrasings may suit its patterns: add your own
# conversations below (any id C50+) to keep it honest.
#
# Every turn has a gold outcome. A turn whose gold is "answered" also has a `state`: the facts as
# they stand after that turn (same fields as eval/scenarios.yaml). Its dollar gold comes from the
# spreadsheet formulas in eval/conv_gold.xlsx (eval/build_conversations.py), never from src/tools.
#
# A turn is either `user: "<text>"` or `edit: {field: <fact>, value: <new value>}` (a fact changed
# on the answer card in the web app).
# gold.assumptions: facts answered with a SPEC 5.2 default (after two unanswered rounds).

conversations:

- id: C01
  type: clarify_then_answer
  turns:
    - user: "Bringing back 3 bottles of Spanish Rioja, 750 ml, 13.5%, $22 each. What do I owe?"
      gold: {outcome: clarify, clarify_facts: [age, trip_length, exemption_used_last_30_days]}
    - user: "I'm 38, I was in Spain for 9 days, first trip this year."
      state:
        profile: {age: 38, trip: {value: 9, unit: days}, exemption_used_last_30_days: false}
        basket:
          - {item: Rioja, category: alcohol, type: wine, quantity: {value: 3, unit: bottle}, unit_ml: 750, abv: 13.5, unit_price_usd: 22, origin: ES, bought_where: ES, excise_class: wine_still_le16, gold_exempt_l: 1.0}
      gold: {outcome: answered, exemption: standard_800, bottom_line: [owe], citations: [19cfr148.33, htsus9816.00.20, ttb-tax-rates]}

- id: C02
  type: clarify_partial_answers
  turns:
    - user: "2 bottles of Japanese whisky, 700 ml, 43%, $60 each. Duty?"
      gold: {outcome: clarify, clarify_facts: [age, trip_length, exemption_used_last_30_days]}
    - user: "I'm forty-two."
      gold: {outcome: clarify, clarify_facts: [trip_length, exemption_used_last_30_days]}
    - user: "Two weeks in Tokyo, and no other trips lately."
      state:
        profile: {age: 42, trip: {value: 2, unit: weeks}, exemption_used_last_30_days: false}
        basket:
          - {item: Japanese whisky, category: alcohol, type: spirits, quantity: {value: 2, unit: bottle}, unit_ml: 700, abv: 43, unit_price_usd: 60, origin: JP, bought_where: JP, excise_class: spirits, gold_exempt_l: 1.0}
      gold: {outcome: answered, exemption: standard_800, bottom_line: [owe], citations: [19cfr148.33, htsus9816.00.20, ttb-tax-rates]}

- id: C03
  type: correction_trip_length
  note: the correction moves the trip under 48 hours, so the $200 all-or-nothing rule replaces the $800 exemption
  turns:
    - user: "I'm 35, back from 3 days in Paris, first trip this year. 2 bottles of Bordeaux from France, 750 ml, 13.5%, $45 each. Do I owe anything?"
      state:
        profile: {age: 35, trip: {value: 3, unit: days}, exemption_used_last_30_days: false}
        basket:
          - {item: Bordeaux, category: alcohol, type: wine, quantity: {value: 2, unit: bottle}, unit_ml: 750, abv: 13.5, unit_price_usd: 45, origin: FR, bought_where: FR, excise_class: wine_still_le16, gold_exempt_l: 1.0}
      gold: {outcome: answered, exemption: standard_800, bottom_line: [owe], citations: [19cfr148.33, htsus9816.00.20, ttb-tax-rates]}
    - user: "Sorry, I got that wrong: I was only there for 30 hours."
      state:
        profile: {age: 35, trip: {value: 30, unit: hours}, exemption_used_last_30_days: false}
        basket:
          - {item: Bordeaux, category: alcohol, type: wine, quantity: {value: 2, unit: bottle}, unit_ml: 750, abv: 13.5, unit_price_usd: 45, origin: FR, bought_where: FR, excise_class: wine_still_le16, gold_exempt_l: 0}
      gold: {outcome: answered, exemption: short_trip_200, bottom_line: [owe], citations: [19cfr148.51, htsus9816.00.20, ttb-tax-rates]}

