- id: C06
  type: correction_origin_cuban
  note: a correction that triggers a restriction; the ban applies wherever the cigars were bought
  turns:
    - user: "A box of 25 cigars from the Dominican Republic, $150, bought in Punta Cana. I'm 44, back after a week, first trip this year. All good?"
      state:
        profile: {age: 44, trip: {value: 1, unit: weeks}, exemption_used_last_30_days: false}
        basket:
          - {item: Dominican cigars, category: tobacco, type: cigars, quantity: {value: 1, unit: box of 25}, count: 25, unit_price_usd: 150, origin: DO, bought_where: DO}
      gold: {outcome: answered, exemption: standard_800, bottom_line: [nothing_to_pay], citations: [19cfr148.33]}
    - user: "Wait, I checked the box: they're actually Cuban cigars. I still bought them in Punta Cana."
      state:
        profile: {age: 44, trip: {value: 1, unit: weeks}, exemption_used_last_30_days: false}
        basket:
          - {item: Cuban cigars, category: tobacco, type: cigars, quantity: {value: 1, unit: box of 25}, count: 25, unit_price_usd: 150, origin: CU, bought_where: DO}
      gold: {outcome: answered, bottom_line: [prohibited], citations: [31cfr515.204, 31cfr515.585]}

