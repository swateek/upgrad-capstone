        basket:
          - {item: Riesling, category: alcohol, type: wine, quantity: {value: 2, unit: bottle}, unit_ml: 750, abv: 11, unit_price_usd: 18, origin: DE, bought_where: DE, excise_class: wine_still_le16, gold_exempt_l: 1.0}
      gold: {outcome: answered, exemption: standard_800, bottom_line: [owe], citations: [19cfr148.33, htsus9816.00.20, ttb-tax-rates]}
    - user: "Actually I'm 20, not 23."
