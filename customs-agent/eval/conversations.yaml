      state:
        profile: {age: 29, trip: {value: 5, unit: days}, direct_arrival_from: MX, exemption_used_last_30_days: false}
        basket:
          - {item: mezcal, category: alcohol, type: spirits, quantity: {value: 3, unit: bottle}, unit_ml: 750, abv: 45, unit_price_usd: 40, origin: MX, bought_where: MX, excise_class: spirits, gold_exempt_l: 1.0}
      gold: {outcome: answered, exemption: standard_800, bottom_line: [owe], citations: [19cfr148.33, htsus9816.00.20, ttb-tax-rates]}
    - edit: {field: age, value: 19}
      state:
        profile: {age: 19, trip: {value: 5, unit: days}, direct_arrival_from: MX, exemption_used_last_30_days: false}
        basket:
          - {item: mezcal, category: alcohol, type: spirits, quantity: {value: 3, unit: bottle}, unit_ml: 750, abv: 45, unit_price_usd: 40, origin: MX, bought_where: MX, excise_class: spirits, gold_exempt_l: 0}
      gold: {outcome: answered, exemption: standard_800_no_alcohol_under_21, bottom_line: [owe], citations: [19cfr148.33, htsus9816.00.20, ttb-tax-rates]}

- id: C08
  type: default_after_two_rounds_escalates
  note: SPEC 5.2 default for an unanswered 30-day question is "used", and the flat rate is then treated as used, so an officer decides
  turns:
    - user: "I'm 40, back from a week in Colombia. 2 bottles of Colombian rum, 1 litre each, 40%, $25 a bottle. What do I owe?"
      gold: {outcome: clarify, clarify_facts: [exemption_used_last_30_days]}
    - user: "Does that matter?"
      gold: {outcome: clarify, clarify_facts: [exemption_used_last_30_days]}
    - user: "I'd rather not say."
      gold: {outcome: escalated, assumptions: [exemption_used_last_30_days]}

- id: C09
  type: default_after_two_rounds_answers
  note: SPEC 5.2 default ABV for spirits is 40%
  turns:
    - user: "I'm 50, back from 10 days in Ireland, first trip this year, with 2 bottles of Irish whiskey, 1 litre each, $40 each. What do I owe?"
      gold: {outcome: clarify, clarify_facts: [abv]}
    - user: "No idea, the label's in the bag."
      gold: {outcome: clarify, clarify_facts: [abv]}
    - user: "Still don't know, just estimate it."
      state:
        profile: {age: 50, trip: {value: 10, unit: days}, exemption_used_last_30_days: false}
        basket:
          - {item: Irish whiskey, category: alcohol, type: spirits, quantity: {value: 2, unit: bottle}, unit_ml: 1000, abv: 40, unit_price_usd: 40, origin: IE, bought_where: IE, excise_class: spirits, gold_exempt_l: 1.0}
      gold: {outcome: answered, exemption: standard_800, bottom_line: [owe], assumptions: [abv], citations: [19cfr148.33, htsus9816.00.20, ttb-tax-rates]}

