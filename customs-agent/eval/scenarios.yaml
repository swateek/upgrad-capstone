# DeclareRight evaluation scenarios: questions, facts and non-dollar gold.
#
# Dollar gold (dutiable value, duty, excise, totals, what-if answers) is computed by the
# formulas in eval/gold.xlsx, never by src/tools (CLAUDE.md rule 5). build_eval.py writes
# the basket lines below into gold.xlsx and, after the workbook is recalculated, exports
# eval_set.jsonl and dev_set.jsonl.
#
# Field guide (see eval/README.md):
#   profile: age, trip {value, unit} as stated, direct_arrival_from, exemption_used_last_30_days,
#            flat_rate_used_last_30_days (defaults to exemption_used_last_30_days), arrival_state
#   basket line: item, category, type, quantity {value, unit}, unit_ml (alcohol), count (tobacco),
#            abv (percent), unit_price_usd, origin (where made), bought_where, export_labelled_us,
#            excise_class (alcohol), gold_exempt_l (hand allocation: litres of this line inside
#            the exemption, highest duty + excise per litre first, 19 CFR 148.33(b))
#   gold: outcome (answered | clarify | refused | escalated), reason, exemption,
#         bottom_line (one type per basket line, same order), clarify_facts (all asked in one
#         message, SPEC 5.2), state_flag,
#         citations (short ids; all must be cited), must_not_contain
#
# excise_class: wine_still_le16 | wine_still_16_21 | sparkling | spirits | beer
# bottom_line types: owe | nothing_to_pay | prohibited | declare_detention_risk | relinquish_excess

scenarios:

# ===================================================================== EVAL (80)

