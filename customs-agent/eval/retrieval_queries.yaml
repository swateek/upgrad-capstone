# Retrieval query set for the Days 5-7 experiment (recall@k).
#
# Separate from eval_set.jsonl so retrieval choices are not tuned on the eval (CLAUDE.md rule 6):
# short, varied phrasings of what the agent will search for, written from the regulation text.
# gold: citation_ids that answer the query; a hit is any retrieved chunk whose citation_id is in gold.
# trap: a near-duplicate the retriever might prefer (e.g. the crew rules, 19cfr148.64).
# All gold ids are checked against data/rag-corpus/corpus/MANIFEST.json by the experiment script.

queries:
